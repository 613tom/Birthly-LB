name: Build class schedule

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [airtable-changed]
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/**"
      - "public/embed.js"
      - "public/index.html"

concurrency:
  group: build-schedule
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate classes.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/build.mjs

      - name: Fail if instructor emails leaked into the output
        run: |
          if grep -qiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' public/classes.json; then
            echo "::error::An email address reached public/classes.json. Refusing to publish."
            exit 1
          fi

      - name: Commit if the schedule changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/classes.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update class schedule"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
